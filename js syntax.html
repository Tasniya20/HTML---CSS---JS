<!DOCTYPE html>
<html>
<body>

    <h2>JavaScript Basics</h2>

    <p id="demo"></p>

    <script>

        // Variables
        let firstName = "Tasniya";
        let semester = 6;

        // Constant variable
        const country = "Bangladesh";

        // Arithmetic operation + Expression
        let nextSems = semester + 1;

        // Display the values
        document.getElementById("demo").innerHTML =
            "Name: " + firstName + "<br>" +
            "Semester: " + semester + "<br>" +
            "Next Semester: " + nextSems + "<br>" +
            "Country: " + country;

    </script>

</body>
</html>
