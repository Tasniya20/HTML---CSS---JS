<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Statement</h2>
        <p id="demo"></p>

        <script>
           // variable declaretion
           let firstName = "Tasniya";
           let semester = 6; 

           //Arithmetic expression
           let nextSemester = semester + 1;

           // code block
           if(semester===6){
            document.getElementById("demo").innerHTML = 
                "Name: " + firstName + "<br>" +
                "Current Semester: " + semester + "<br>" +
                "Next Semester: " + nextSemester;
           }
        </script>
    </body>
</html>
