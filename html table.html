<!--Table cells : Each table cell is defined by a <td> and a </td> tag-->
<!--Table rows : Each table row starts with a <tr> and end with a </tr>-->
<!--Table Headers : Sometimes we want cells to be table header cells. In those cases use the <th> tag instead of the <td> tag-->

<!DOCKTYPE html>
<html>
    <style>
        table, th, td{
            border:1px solid black:
        }
    </style>
    <body>

        <h2>TH elements define table headers</h2>

        <table style="width:100%">
            <tr>
                <th>Person 1</th>
                <th>Person 2</th>
                <th>Person 3</th>
            </tr>

            <tr>
                <td>Emil</td>
                <td>Tobies</td>
                <td>Linus</td>
            </tr>

            <tr>
                <td>16</td>
                <td>14</td>
                <td>10</td>
            </tr>
        </table>

        <p>Understand the table</p>
    </body>
</html>
