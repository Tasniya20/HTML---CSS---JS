<!--<ol> : ordered list [number or lette]-->

<!--<dl> : description list [term + description]-->
<!--<dt> : description term [topic]-->
<!--<dd> : description details [term description]-->  
    
<!DOCTYPE html>
<html>
    <head>
        <style>
           h3{ color:rgb(255, 192, 232); /* headline text color */
               background-color:transparent; /* background clear */
             } 
        </style> 
    </head>       
    <body>
        <h3> Unordered List (ul)</h3>
        <ul>
            <li>Books</li>
            <li>Coding</li>
            <li>Gaming</li>
        </ul>

        <h3>Ordered List (ol)</h3>
        <ol>
            <li>Step 1: Open VS code</li>
            <li>Step 2: Write HTML</li>
            <li>Step 3: Save & Run</li>
        </ol>

        <h3> Description List (dl)</h3>
        <dl>
            <dt>HTML</dt>
            <dd>HyperText Markup Language</dd>
            <dt>CSS</dt>
            <dd>Cascading Style Sheets</dd>
        </dl>
       
    </body>
</html>
