<!--Padding[inside gap] : The space insid a cell, between the content and the cell border-->
<!--Spacing[outside gap] : The space between cells, form one cell's border to another cell's border-->

<!DOCTYPE html>
<html>
    <head>
        <style>
            table {
                border: 2px solid black:
                border-spacing: 20px; / * spacing between cells */
            }
            th,td  {
                border : 1px solid black:
                padding : 15px; /* space inside each cell */
            }
        </style>
    </head>
    <body>
        <h2>Padding vs Spacing Example</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>University</th>
            </tr>
            <tr>
                <td>Anni</td>
                <td>CSE</td>
                <td>NUBTK</td>
            </tr>
        </table>
    </body>
</html>
